<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Hello Sci-Fi World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #050510;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* 科幻霓虹文字 */
        .text-box {
            font-family: "Microsoft Yahei",sans-serif;
            font-size: 4rem;
            font-weight: bold;
            color: #0ff;
            text-shadow:
                0 0 8px #0ff,
                0 0 18px #00ccff,
                0 0 35px #0088ff;
            animation: flicker 3s infinite alternate;
        }
        /* 闪烁动画 */
        @keyframes flicker {
            0% {opacity: 0.85;filter: brightness(1);}
            100% {opacity: 1;filter: brightness(1.2);}
        }
        /* 星空小点 */
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            from {opacity:0.2;}
            to {opacity:1;}
        }
    </style>
</head>
<body>
    <div class="text-box">Hello World</div>

    <script>
        // 自动生成随机星空背景
        const body = document.body;
        for(let i=0; i<120; i++){
            let star = document.createElement("div");
            star.className = "star";
            // 随机大小、位置、延迟
            let size = Math.random()*2+1;
            star.style.width = size+"px";
            star.style.height = size+"px";
            star.style.left = Math.random()*100+"%";
            star.style.top = Math.random()*100+"%";
            star.style.animationDelay = Math.random()*2+"s";
            body.appendChild(star);
        }
    </script>
</body>
</html>
